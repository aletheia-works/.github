name: Terraform State Backup

# Reusable: renew one module's state artifact. Artifacts expire after at
# most 90 days, so a module whose apply stays quiet for a quarter would
# otherwise lose its state entirely; re-uploading here rolls that window
# forward on every run. The state is kept only as this artifact, encrypted
# by the plan / apply / seed workflows. A state that is lost anyway is
# rebuilt by importing the live resources.
#
# Callers own the triggers. `workflow_run` in particular cannot live here:
# it fires in the repo where the completed workflow ran, not in the
# reusable workflow's home repo.

on:
  workflow_call:
    inputs:
      state_artifact_name:
        description: "Name of the GitHub Actions artifact storing the tofu state. Matches the value the module's apply uses."
        type: string
        required: false
        default: terraform-state
      state_run_id_variable:
        description: "Name of the repo variable holding the run-id whose artifact carries this module's state."
        type: string
        required: false
        default: LATEST_APPLY_RUN_ID
      module_label:
        description: "Short module name shown in the error messages. Leave empty in a repo with a single module."
        type: string
        required: false
        default: ""
      working_directory:
        description: "Directory of the module, shown in the error messages."
        type: string
        required: false
        default: infra/github
    secrets:
      TF_TOKEN_GITHUB:
        description: "PAT with variables:write, used to move the run-id variable to this run. The automatic GITHUB_TOKEN cannot write repo variables."
        required: true

permissions:
  contents: read
  actions: write # Required to read the state artifact and re-upload it.

# Same key the apply and seed workflows use, so a backup never runs while
# this module's state is being written.
concurrency:
  group: ${{ inputs.state_artifact_name }}
  cancel-in-progress: false

jobs:
  backup:
    name: Renew the state artifact
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the run holding the state
        id: source
        env:
          RUN_ID: ${{ vars[inputs.state_run_id_variable] }}
          VARIABLE: ${{ inputs.state_run_id_variable }}
          LABEL: ${{ inputs.module_label }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID}" ]; then
            echo "::error::${VARIABLE} is unset, so there is no state to back up${LABEL:+ for ${LABEL}}. Run the apply, or seed the state first."
            exit 1
          fi
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

      - name: Download state artifact
        id: artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.state_artifact_name }}
          path: ./state-backup/
          run-id: ${{ steps.source.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Report the missing artifact and stop
        if: steps.artifact.outcome != 'success'
        env:
          ARTIFACT: ${{ inputs.state_artifact_name }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          LABEL: ${{ inputs.module_label }}
          MODULE_DIR: ${{ inputs.working_directory }}
        run: |
          echo "::error::The ${ARTIFACT} artifact for run ${RUN_ID} could not be downloaded, so this run cannot renew it${LABEL:+ for ${LABEL}}. Rebuild the state of ${MODULE_DIR} by importing the live resources with the Seed Terraform State workflow, then re-run this one."
          exit 1

      # An encrypted state shows only its envelope, so it is checked for
      # encrypted data; a state written before encryption still has to list
      # its resources.
      - name: Verify the state is usable
        run: |
          if [ ! -f ./state-backup/terraform.tfstate ]; then
            echo "::error::Expected ./state-backup/terraform.tfstate after artifact download but the file is missing."
            exit 1
          fi
          if ! jq -e '(.encrypted_data | type == "string" and length > 0) or (.resources | length > 0)' ./state-backup/terraform.tfstate >/dev/null 2>&1; then
            echo "::error::State has neither encrypted data nor resources. Refusing to renew the artifact from it."
            exit 1
          fi

      - name: Renew the state artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.state_artifact_name }}
          path: ./state-backup/terraform.tfstate
          retention-days: 90
          overwrite: true

      - name: Point the run-id variable at this run
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.run_id }}
          VARIABLE: ${{ inputs.state_run_id_variable }}
        with:
          github-token: ${{ secrets.TF_TOKEN_GITHUB }}
          script: |
            const name = process.env.VARIABLE;
            const expected = process.env.SOURCE_RUN_ID;
            const { data } = await github.rest.actions.getRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
            });
            if (data.value !== expected) {
              core.warning(
                `${name} moved to ${data.value} while this run was reading ${expected}; ` +
                  'a newer apply owns the state, so the artifact lease is left alone.',
              );
              return;
            }
            await github.rest.actions.updateRepoVariable({
              owner: context.repo.owner,
              repo: context.repo.repo,
              name,
              value: `${context.runId}`,
            });
