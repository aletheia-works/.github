name: Terraform Plan

on:
  workflow_call:
    inputs:
      working_directory:
        description: "Directory containing the OpenTofu configuration."
        type: string
        required: false
        default: infra/github-org
      tofu_version:
        description: "OpenTofu version to install."
        type: string
        required: false
        default: "latest"
      tfvar_assignments:
        description: "Extra -var=key=value arguments appended to tofu plan, one per line. github_owner is preset from the repository owner and must not be repeated here."
        type: string
        required: false
        default: ""
      state_artifact_name:
        description: "Name of the GitHub Actions artifact storing the tofu state. Override per module when a caller repo manages multiple OpenTofu modules."
        type: string
        required: false
        default: terraform-state
      state_run_id_variable:
        description: "Name of the repo variable that holds the run-id of the most recent successful apply for this module's state."
        type: string
        required: false
        default: LATEST_APPLY_RUN_ID
      aws_role_arn:
        description: "IAM role assumed through GitHub's OIDC token before tofu runs, for a module that manages AWS. Leave empty for none. The caller must grant id-token: write."
        type: string
        required: false
        default: ""
      aws_region:
        description: "AWS Region for the assumed role's session. Used only with aws_role_arn."
        type: string
        required: false
        default: ""

# No workflow-level permissions: the caller's grant passes down. A caller
# grants contents: read, pull-requests: write and actions: read, and adds
# id-token: write only when it passes aws_role_arn. Naming id-token here
# would make every caller grant it.

concurrency:
  group: ${{ inputs.state_artifact_name }}
  cancel-in-progress: false

jobs:
  # Callers trigger on `pull_request_target`, which hands this workflow
  # every secret while it runs the PR's own configuration, and `tofu plan`
  # can execute code from that configuration. Plan therefore runs only for
  # a PR opened from this repository or by someone with write access to it.
  authorize:
    name: Authorize the plan
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Check who opened the PR
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr || pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              core.setOutput('allowed', 'true');
              return;
            }
            const { data } = await github.rest.repos.getCollaboratorPermissionLevel({
              owner: context.repo.owner,
              repo: context.repo.repo,
              username: pr.user.login,
            });
            const allowed = ['admin', 'maintain', 'write'].includes(data.role_name);
            if (!allowed) {
              core.notice(`Skipping the plan: ${pr.user.login} has ${data.role_name} access, and a PR from a fork needs write access to run it.`);
            }
            core.setOutput('allowed', String(allowed));

  plan:
    name: OpenTofu Plan
    needs: authorize
    if: needs.authorize.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          allow-unsafe-pr-checkout: true

      # Only a module that manages AWS passes a role. The token comes from
      # GitHub's OIDC issuer, so no AWS access key is stored anywhere.
      - name: Configure AWS credentials
        if: inputs.aws_role_arn != ''
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ inputs.aws_role_arn }}
          aws-region: ${{ inputs.aws_region }}

      - name: Setup OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: ${{ inputs.tofu_version }}
          tofu_wrapper: false

      # Encrypt the state before it leaves the runner: any signed-in user
      # can download the artifacts of a public repository. The unencrypted
      # fallback only reads a state written before encryption; every write
      # is encrypted.
      - name: Configure state encryption
        env:
          TF_STATE_PASSPHRASE: ${{ secrets.TF_STATE_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ ! "${TF_STATE_PASSPHRASE}" =~ ^[0-9a-f]{64}$ ]]; then
            echo "::error::TF_STATE_PASSPHRASE must be 64 lowercase hex characters (openssl rand -hex 32)."
            exit 1
          fi
          {
            echo 'TF_ENCRYPTION<<TF_ENCRYPTION_EOF'
            cat <<EOF
          key_provider "pbkdf2" "state" {
            passphrase = "${TF_STATE_PASSPHRASE}"
          }
          method "aes_gcm" "state" {
            keys = key_provider.pbkdf2.state
          }
          method "unencrypted" "migrate" {}
          state {
            method = method.aes_gcm.state
            fallback {
              method = method.unencrypted.migrate
            }
          }
          EOF
            echo 'TF_ENCRYPTION_EOF'
          } >> "$GITHUB_ENV"

      - name: Download state artifact
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.state_artifact_name }}
          path: ${{ inputs.working_directory }}/
          run-id: ${{ vars[inputs.state_run_id_variable] || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tofu Init
        run: tofu init
        env:
          GITHUB_TOKEN: ${{ secrets.TF_TOKEN_GITHUB }}

      - name: Tofu Format Check
        id: fmt
        run: tofu fmt -check -recursive
        continue-on-error: true

      - name: Tofu Validate
        id: validate
        run: tofu validate

      - name: Tofu Plan
        id: plan
        run: |
          extra_args=""
          if [ -n "${TFVAR_ASSIGNMENTS}" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              extra_args="${extra_args} -var=${line}"
            done <<< "${TFVAR_ASSIGNMENTS}"
          fi
          tofu plan -no-color -out=tfplan \
            -var="github_owner=${REPO_OWNER}" \
            ${extra_args} 2>&1 | tee plan_output.txt
          exit "${PIPESTATUS[0]}"
        env:
          GITHUB_TOKEN: ${{ secrets.TF_TOKEN_GITHUB }}
          REPO_OWNER: ${{ github.repository_owner }}
          TFVAR_ASSIGNMENTS: ${{ inputs.tfvar_assignments }}
        continue-on-error: true

      - name: Write plan to Step Summary
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          PLAN_OUTPUT_PATH: ${{ inputs.working_directory }}/plan_output.txt
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          FMT_STATUS: ${{ steps.fmt.outcome }}
          VALIDATE_STATUS: ${{ steps.validate.outcome }}
          PLAN_STATUS: ${{ steps.plan.outcome }}
        run: |
          fmt_icon='✅ Passed'; [ "$FMT_STATUS" != 'success' ] && fmt_icon='⚠️ Formatting issues'
          validate_icon='✅ Passed'; [ "$VALIDATE_STATUS" != 'success' ] && validate_icon='❌ Failed'
          plan_icon='✅ Ready to apply'; [ "$PLAN_STATUS" != 'success' ] && plan_icon='❌ Failed'
          {
            echo "## 📋 OpenTofu Plan Result (\`${WORKING_DIRECTORY}\`)"
            echo
            echo "| Step | Status |"
            echo "|---|---|"
            echo "| Format | ${fmt_icon} |"
            echo "| Validate | ${validate_icon} |"
            echo "| Plan | ${plan_icon} |"
            echo
            echo '<details><summary>📄 Plan Output</summary>'
            echo
            echo '```terraform'
            if [ -f "$PLAN_OUTPUT_PATH" ]; then
              head -c 60000 "$PLAN_OUTPUT_PATH"
              if [ "$(wc -c < "$PLAN_OUTPUT_PATH")" -gt 60000 ]; then
                echo
                echo '...(output truncated)...'
              fi
            else
              echo '(plan_output.txt was not produced — see earlier steps)'
            fi
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post Plan to PR
        if: |
          github.event_name == 'pull_request_target' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          PLAN_OUTPUT_PATH: ${{ inputs.working_directory }}/plan_output.txt
          WORKING_DIRECTORY: ${{ inputs.working_directory }}
          FMT_STATUS: ${{ steps.fmt.outcome }}
          VALIDATE_STATUS: ${{ steps.validate.outcome }}
          PLAN_STATUS: ${{ steps.plan.outcome }}
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(process.env.PLAN_OUTPUT_PATH, 'utf8');

            // Truncate overly long output so the PR comment stays within the API limit.
            const maxLength = 60000;
            const truncated = planOutput.length > maxLength
              ? planOutput.slice(0, maxLength) + '\n\n...(output truncated)...'
              : planOutput;

            const fmtStatus = process.env.FMT_STATUS;
            const validateStatus = process.env.VALIDATE_STATUS;
            const planStatus = process.env.PLAN_STATUS;
            const workingDir = process.env.WORKING_DIRECTORY;

            // Marker scoped by working_directory so one PR can carry plan
            // comments for multiple modules without collision.
            const marker = `<!-- tofu-plan:${workingDir} -->`;

            const body = `## 📋 OpenTofu Plan Result (\`${workingDir}\`)

            | Step | Status |
            |---|---|
            | Format | ${fmtStatus === 'success' ? '✅ Passed' : '⚠️ Formatting issues'} |
            | Validate | ${validateStatus === 'success' ? '✅ Passed' : '❌ Failed'} |
            | Plan | ${planStatus === 'success' ? '✅ Ready to apply' : '❌ Failed'} |

            <details>
            <summary>📄 Plan Output</summary>

            \`\`\`terraform
            ${truncated}
            \`\`\`

            </details>

            ---
            *Triggered by: @${context.actor} | Commit: ${context.sha.slice(0, 7)}*
            ${marker}
            `;

            // Update the existing bot comment for this module if one exists,
            // otherwise create a new one.
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes(marker)
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail if plan failed
        if: steps.plan.outcome != 'success'
        run: exit 1
